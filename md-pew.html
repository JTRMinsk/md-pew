    function showExportDownloads(outputs, title) {
      clearExportDownloads();
      exportTrayTitle.textContent = title;

      outputs.forEach((output) => {
        const url = URL.createObjectURL(output.blob);
        exportDownloadUrls.push(url);

        const link = document.createElement("a");
        link.href = url;
        link.download = output.fileName;
        link.textContent = output.fileName;
        exportTrayList.appendChild(link);
      });

      exportTray.hidden = false;
    }

    function startDefaultDownloads() {
      Array.from(exportTrayList.querySelectorAll("a")).forEach((link, index) => {
        window.setTimeout(() => link.click(), index * 120);
      });
    }

    async function createZipArchive(outputs, folderName) {
      const encoder = new TextEncoder();
      const entries = [{
        name: `${folderName}/`,
        bytes: new Uint8Array(),
        directory: true
      }];

      for (const output of outputs) {
        entries.push({
          name: `${folderName}/${output.fileName}`,
          bytes: new Uint8Array(await output.blob.arrayBuffer()),
          directory: false
        });
      }

      const chunks = [];
      const centralChunks = [];
      let offset = 0;

      entries.forEach((entry) => {
        const nameBytes = encoder.encode(entry.name);
        const crc = entry.directory ? 0 : crc32(entry.bytes);
        const localHeader = createZipLocalHeader(nameBytes, entry.bytes.length, crc);

        chunks.push(localHeader, nameBytes, entry.bytes);
        centralChunks.push(createZipCentralHeader(nameBytes, entry.bytes.length, crc, offset, entry.directory), nameBytes);
        offset += localHeader.length + nameBytes.length + entry.bytes.length;
      });

      const centralSize = centralChunks.reduce((sum, chunk) => sum + chunk.length, 0);
      const endRecord = createZipEndRecord(entries.length, centralSize, offset);
      return new Blob([...chunks, ...centralChunks, endRecord], { type: "application/zip" });
    }

    function createZipLocalHeader(nameBytes, size, crc) {
      const header = new Uint8Array(30);
      const view = new DataView(header.buffer);
      const time = zipDosTime(new Date());

      view.setUint32(0, 0x04034b50, true);
      view.setUint16(4, 20, true);
      view.setUint16(6, 0x0800, true);
      view.setUint16(8, 0, true);
      view.setUint16(10, time.time, true);
      view.setUint16(12, time.date, true);
      view.setUint32(14, crc, true);
      view.setUint32(18, size, true);
      view.setUint32(22, size, true);
      view.setUint16(26, nameBytes.length, true);
      view.setUint16(28, 0, true);
      return header;
    }

    function createZipCentralHeader(nameBytes, size, crc, offset, directory) {
      const header = new Uint8Array(46);
      const view = new DataView(header.buffer);
      const time = zipDosTime(new Date());

      view.setUint32(0, 0x02014b50, true);
      view.setUint16(4, 20, true);
      view.setUint16(6, 20, true);
      view.setUint16(8, 0x0800, true);
      view.setUint16(10, 0, true);
      view.setUint16(12, time.time, true);
      view.setUint16(14, time.date, true);
      view.setUint32(16, crc, true);
      view.setUint32(20, size, true);
      view.setUint32(24, size, true);
      view.setUint16(28, nameBytes.length, true);
      view.setUint16(30, 0, true);
      view.setUint16(32, 0, true);
      view.setUint16(34, 0, true);
      view.setUint16(36, 0, true);
      view.setUint32(38, directory ? 0x10 : 0, true);
      view.setUint32(42, offset, true);
      return header;
    }

    function createZipEndRecord(entryCount, centralSize, centralOffset) {
      const record = new Uint8Array(22);
      const view = new DataView(record.buffer);

      view.setUint32(0, 0x06054b50, true);
      view.setUint16(4, 0, true);
      view.setUint16(6, 0, true);
      view.setUint16(8, entryCount, true);
      view.setUint16(10, entryCount, true);
      view.setUint32(12, centralSize, true);
      view.setUint32(16, centralOffset, true);
      view.setUint16(20, 0, true);
      return record;
    }

    function zipDosTime(date) {
      return {
        time: (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2),
        date: ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate()
      };
    }

    function crc32(bytes) {
      let crc = -1;
      for (let index = 0; index < bytes.length; index += 1) {
        crc = (crc >>> 8) ^ crc32Table()[(crc ^ bytes[index]) & 0xff];
      }
      return (crc ^ -1) >>> 0;
    }

    function crc32Table() {
      if (crc32Table.cache) return crc32Table.cache;

      crc32Table.cache = Array.from({ length: 256 }, (_, index) => {
        let value = index;
        for (let bit = 0; bit < 8; bit += 1) {
          value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
        }
        return value >>> 0;
      });

      return crc32Table.cache;
    }

    function clearExportDownloads() {
      exportDownloadUrls.forEach((url) => URL.revokeObjectURL(url));
      exportDownloadUrls = [];
      exportTrayList.innerHTML = "";
      exportTray.hidden = true;
    }

    function createExportDocument(className) {
      const article = document.createElement("article");
      article.className = className;
      article.innerHTML = markdownToHtml(editor.value);
      sanitizeExportNode(article);
      return article;
    }

    function sanitizeExportNode(node) {
      getElementsIncludingSelf(node, ".mermaid-toggle").forEach((button) => button.remove());
      getElementsIncludingSelf(node, ".mermaid-diagram").forEach((diagram) => {
        diagram.classList.remove("expanded", "has-overflow");
      });
      getElementsIncludingSelf(node, "img").forEach((image) => {
        if (image.src) image.setAttribute("src", image.src);
        image.removeAttribute("tabindex");
        image.style.cursor = "";
      });
    }

    function getElementsIncludingSelf(node, selector) {
      const elements = [];
      if (node.matches && node.matches(selector)) elements.push(node);
      elements.push(...Array.from(node.querySelectorAll(selector)));
      return elements;
    }

    function findOversizedExportItems(documentNode) {
      const contentWidth = exportConfig.pageWidth - exportConfig.padding * 2;
      const items = [];
      const sources = new Set();

      const addItem = (source, type, target, width) => {
        if (!source || sources.has(source) || width <= contentWidth + 2) return;
        sources.add(source);
        const title = inferExportTitle(source, type, target) || `${exportTypeLabel(type)} ${items.length + 1}`;
        items.push({ source, type, target, width: Math.ceil(width), title });
      };

      Array.from(documentNode.querySelectorAll("img")).forEach((image) => {
        const source = topLevelExportElement(image, documentNode);
        const rect = image.getBoundingClientRect();
        const width = Math.max(image.naturalWidth || 0, image.scrollWidth || 0, rect.width || 0);
        addItem(source, "image", image, width);
      });

      Array.from(documentNode.querySelectorAll("table")).forEach((table) => {
        const source = topLevelExportElement(table, documentNode);
        const rect = table.getBoundingClientRect();
        const width = Math.max(table.scrollWidth || 0, rect.width || 0);
        addItem(source, "table", table, width);
      });

      Array.from(documentNode.querySelectorAll(".mermaid-diagram")).forEach((diagram) => {
        const source = topLevelExportElement(diagram, documentNode);
        const svg = diagram.querySelector("svg");
        const rect = (svg || diagram).getBoundingClientRect();
        const width = Math.max(Number(svg && svg.getAttribute("width")) || 0, diagram.scrollWidth || 0, rect.width || 0);
        addItem(source, "diagram", diagram, width);
      });

      return items;
    }

    function topLevelExportElement(element, root) {
      let current = element;
      while (current && current.parentElement && current.parentElement !== root) {
        current = current.parentElement;
      }
      return current || element;
    }

    function inferExportTitle(source, type, target) {
      if (type === "image" && target.alt) return target.alt.trim();

      const caption = previousCaptionText(source, type);
      if (caption) return caption;

      const heading = previousHeadingText(source);
      if (heading) return heading;

      return "";
    }

    function previousCaptionText(source, type) {
      const patterns = {
        image: /^(?:图|figure)\s*[\w.-]*\s*[:：.、-]?\s*\S/i,
        table: /^(?:表|table)\s*[\w.-]*\s*[:：.、-]?\s*\S/i,
        diagram: /^(?:图|figure|diagram)\s*[\w.-]*\s*[:：.、-]?\s*\S/i
      };
      let current = source.previousElementSibling;

      while (current) {
        const text = compactText(current);
        if (text && text.length <= 140 && patterns[type].test(text)) return text;
        if (text || /^H[1-6]$/i.test(current.tagName)) return "";
        current = current.previousElementSibling;
      }

      return "";
    }

    function previousHeadingText(source) {
      let current = source.previousElementSibling;
      while (current) {
        if (/^H[1-6]$/i.test(current.tagName)) return compactText(current);
        current = current.previousElementSibling;
      }
      return "";
    }

    function compactText(element) {
      return (element.textContent || "").replace(/\s+/g, " ").trim();
    }

    function exportTypeLabel(type) {
      if (type === "table") return "表";
      if (type === "diagram") return "图";
      return "图片";
    }

    function buildExportPages(sourceDoc, oversizedSources) {
      const pages = [];
      let page = createExportPage();
      exportStage.appendChild(page);

      Array.from(sourceDoc.children).forEach((child) => {
        if (oversizedSources.has(child)) return;
        const clone = child.cloneNode(true);
        sanitizeExportNode(clone);
        page.appendChild(clone);

        if (page.scrollHeight > exportConfig.pageHeight + 1 && page.children.length > 1) {
          page.removeChild(clone);
          pages.push(page);
          page = createExportPage();
          exportStage.appendChild(page);
          page.appendChild(clone);
        }
      });

      if (page.children.length || !pages.length) pages.push(page);
      return pages;
    }

    function createExportPage() {
      const page = document.createElement("section");
      page.className = "export-page";
      return page;
    }

    function createStandaloneExportNode(item, index) {
      const node = createExportPage();
      const width = Math.max(exportConfig.pageWidth, Math.ceil(item.width + exportConfig.padding * 2));
      node.classList.add("export-standalone");
      node.style.width = `${Math.min(width, exportConfig.maxCanvasSide)}px`;

      const title = document.createElement("h2");
      title.className = "export-item-title";
      title.textContent = item.title || `${exportTypeLabel(item.type)} ${index + 1}`;
      node.appendChild(title);

      const content = item.source.cloneNode(true);
      sanitizeExportNode(content);
      node.appendChild(content);

      return {
        node,
        namePart: safeFilePart(title.textContent) || `${exportTypeLabel(item.type)}-${index + 1}`
      };
    }

    async function waitForExportAssets(root) {
      const imagePromises = Array.from(root.querySelectorAll("img")).map((image) => {
        if (!image.src || image.complete) return Promise.resolve();
        return new Promise((resolve) => {
          image.addEventListener("load", resolve, { once: true });
          image.addEventListener("error", resolve, { once: true });
        });
      });

      await Promise.all(imagePromises);
    }

    async function prepareExportImages(root) {
      const result = { inlined: 0, replaced: 0 };
      const images = Array.from(root.querySelectorAll("img"));

      for (const image of images) {
        try {
          const dataUrl = await exportImageToDataUrl(image);
          image.setAttribute("src", dataUrl);
          image.removeAttribute("srcset");
          result.inlined += 1;
        } catch (_) {
          image.replaceWith(createExportImagePlaceholder(image));
          result.replaced += 1;
        }
      }

      return result;
    }

    async function prepareExportDiagrams(root) {
      const diagrams = Array.from(root.querySelectorAll(".mermaid-diagram"));

      for (const diagram of diagrams) {
        const svg = diagram.querySelector("svg");
        if (!svg) continue;

        try {
          const serialized = new XMLSerializer().serializeToString(svg);
          const source = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(serialized)}`;
          const image = document.createElement("img");
          image.className = "export-diagram-image";
          image.src = source;
          image.alt = "Mermaid diagram";
          diagram.replaceWith(image);
        } catch (_) {
          const placeholder = document.createElement("div");
          placeholder.className = "export-image-placeholder";
          placeholder.innerHTML = "<strong>图表未嵌入</strong><span>浏览器未能准备此 Mermaid 图。</span>";
          diagram.replaceWith(placeholder);
        }
      }
    }

    async function exportImageToDataUrl(image) {
      const source = image.currentSrc || image.src || image.getAttribute("src") || "";
      if (!source) throw new Error("图片地址为空");
      if (/^data:image\//i.test(source)) return source;

      try {
        const response = await fetch(source, { mode: "cors", credentials: "omit" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const blob = await response.blob();
        if (!/^image\//i.test(blob.type || "")) throw new Error("不是图片资源");
        return await blobToDataUrl(blob);
      } catch (_) {
        return imageElementToDataUrl(image);
      }
    }

    function imageElementToDataUrl(image) {
      const width = image.naturalWidth || image.width;
      const height = image.naturalHeight || image.height;
      if (!width || !height) throw new Error("图片尚未加载");
      if (width > exportConfig.maxCanvasSide || height > exportConfig.maxCanvasSide) {
        throw new Error("图片尺寸过大，无法安全内嵌");
      }

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      context.drawImage(image, 0, 0, width, height);
      return canvas.toDataURL("image/png");
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(reader.error || new Error("图片读取失败"));
        reader.readAsDataURL(blob);
      });
    }

    function createExportImagePlaceholder(image) {
      const placeholder = document.createElement("div");
      placeholder.className = "export-image-placeholder";

      const title = document.createElement("strong");
      title.textContent = image.alt || "外部图片未嵌入";

      const source = document.createElement("span");
      source.textContent = image.currentSrc || image.src || image.getAttribute("src") || "未知来源";

      const note = document.createElement("span");
      note.textContent = "浏览器安全策略阻止读取此图片，导出时已保留图片名称和来源。";

      placeholder.append(title, source, note);
      return placeholder;
    }

    async function renderElementToPngBlob(element, retriedSecurityFallback = false) {
      await waitForExportAssets(element);

      const rect = element.getBoundingClientRect();
      const width = Math.ceil(Math.max(element.scrollWidth || 0, rect.width || 0, exportConfig.pageWidth));
      if (!width) throw new Error("导出内容尺寸为空");
      if (width > exportConfig.maxCanvasSide) throw new Error(`单张图片过宽（${width}px）`);

      const measureCanvas = document.createElement("canvas");
      const measureContext = measureCanvas.getContext("2d");
      const measuredHeight = Math.ceil(drawExportElement(measureContext, element, width, true));
      const height = Math.ceil(Math.max(measuredHeight, element.classList.contains("export-standalone") ? 1 : exportConfig.pageHeight));

      if (height > exportConfig.maxCanvasSide) throw new Error(`单张图片过高（${height}px）`);

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      context.fillStyle = "#fdfaf2";
      context.fillRect(0, 0, width, height);
      drawExportElement(context, element, width, false);

      try {
        return await canvasToBlob(canvas);
      } catch (error) {
        if (!isCanvasSecurityError(error) || retriedSecurityFallback) throw error;
        replaceExportImagesWithPlaceholders(element);
        return await renderElementToPngBlob(element, true);
      }
    }

    function replaceExportImagesWithPlaceholders(root) {
      Array.from(root.querySelectorAll("img")).forEach((image) => {
        image.replaceWith(createExportImagePlaceholder(image));
      });
    }

    function drawExportElement(context, element, canvasWidth, measureOnly) {
      const state = {
        x: exportConfig.padding,
        y: exportConfig.padding,
        width: canvasWidth - exportConfig.padding * 2,
        first: true
      };

      Array.from(element.children).forEach((child) => {
        state.y = drawExportBlock(context, child, state, measureOnly);
        state.first = false;
      });

      return state.y + exportConfig.padding;
    }

    function drawExportBlock(context, element, state, measureOnly) {
      if (element.classList && element.classList.contains("export-image-placeholder")) {
        return drawExportPlaceholder(context, element, state, measureOnly);
      }

      const tag = element.tagName.toUpperCase();
      if (/^H[1-6]$/.test(tag)) return drawExportHeading(context, element, state, measureOnly);
      if (tag === "P") return drawExportParagraph(context, element, state, measureOnly);
      if (tag === "UL" || tag === "OL") return drawExportList(context, element, state, tag === "OL", measureOnly);
      if (tag === "BLOCKQUOTE") return drawExportQuote(context, element, state, measureOnly);
      if (tag === "PRE") return drawExportCode(context, element, state, measureOnly);
      if (tag === "TABLE") return drawExportTable(context, element, state, measureOnly);
      if (tag === "IMG") return drawExportImage(context, element, state, measureOnly);
      if (tag === "HR") return drawExportRule(context, state, measureOnly);

      let y = state.y;
      Array.from(element.children).forEach((child) => {
        y = drawExportBlock(context, child, { ...state, y }, measureOnly);
      });
      return y || state.y;
    }

    function drawExportHeading(context, element, state, measureOnly) {
      const level = Number(element.tagName.slice(1));
      const sizes = { 1: 48, 2: 34, 3: 26, 4: 22, 5: 20, 6: 18 };
      const top = state.y + (state.first ? 0 : level === 1 ? 34 : 24);
      setCanvasFont(context, `${level <= 2 ? 760 : 720} ${sizes[level] || 22}px Georgia, serif`, "#1f2420");
      const y = drawWrappedCanvasText(context, compactText(element), state.x, top, state.width, sizes[level] * 1.32, measureOnly);
      const afterText = y + (level === 1 ? 16 : 14);

      if (level === 1 && !measureOnly) {
        context.strokeStyle = "#1d6d73";
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(state.x, afterText);
        context.lineTo(state.x + state.width, afterText);
        context.stroke();
      }

      return afterText + (level === 1 ? 28 : 14);
    }

    function drawExportParagraph(context, element, state, measureOnly) {
      const image = element.children.length === 1 && element.children[0].tagName && element.children[0].tagName.toUpperCase() === "IMG"
        ? element.children[0]
        : null;
      if (image) return drawExportImage(context, image, state, measureOnly);

      const text = compactText(element);
      if (!text) return state.y;

      setCanvasFont(context, "22px Georgia, serif", "#1f2420");
      const y = drawWrappedCanvasText(context, text, state.x, state.y, state.width, 38, measureOnly);
      return y + 24;
    }

    function drawExportList(context, element, state, ordered, measureOnly) {
      setCanvasFont(context, "22px Georgia, serif", "#1f2420");
      let y = state.y;
      Array.from(element.children).forEach((item, index) => {
        const marker = ordered ? `${index + 1}.` : "-";
        if (!measureOnly) context.fillText(marker, state.x, y);
        y = drawWrappedCanvasText(context, compactText(item), state.x + 34, y, state.width - 34, 36, measureOnly);
        y += 8;
      });
      return y + 18;
    }

    function drawExportQuote(context, element, state, measureOnly) {
      const text = compactText(element);
      const innerX = state.x + 26;
      const innerWidth = state.width - 44;
      setCanvasFont(context, "21px Georgia, serif", "#4e554f");
      const textHeight = measureWrappedCanvasText(context, text, innerWidth, 36);
      const blockHeight = Math.max(92, textHeight + 32);

      if (!measureOnly) {
        context.fillStyle = "rgba(220, 239, 240, 0.58)";
        context.fillRect(state.x, state.y, state.width, blockHeight);
        context.fillStyle = "#1d6d73";
        context.fillRect(state.x, state.y, 5, blockHeight);
      }

      drawWrappedCanvasText(context, text, innerX, state.y + 16, innerWidth, 36, measureOnly);
      return state.y + blockHeight + 28;
    }

    function drawExportCode(context, element, state, measureOnly) {
      const text = element.textContent || "";
      const lineHeight = 25;
      const font = "18px \"Cascadia Code\", \"SFMono-Regular\", Consolas, \"Courier New\", monospace";
      setCanvasFont(context, font, "#1f2420");
      const lines = text
        .replace(/\r\n?/g, "\n")
        .replace(/\n+$/g, "")
        .split("\n")
        .flatMap((line) => wrapPreformattedCanvasText(context, line || " ", state.width - 36));
      const blockHeight = Math.max(70, lines.length * lineHeight + 32);

      if (!measureOnly) {
        context.fillStyle = "#fffdf8";
        roundedCanvasRect(context, state.x, state.y, state.width, blockHeight, 8);
        context.fill();
        context.strokeStyle = "#d9d4c8";
        context.lineWidth = 1;
        context.stroke();
      }

      setCanvasFont(context, font, "#1f2420");
      lines.forEach((line, index) => {
        if (!measureOnly) context.fillText(line, state.x + 18, state.y + 18 + index * lineHeight);
      });

      return state.y + blockHeight + 28;
    }

    function drawExportTable(context, table, state, measureOnly) {
      const rows = Array.from(table.querySelectorAll("tr")).map((row) => Array.from(row.children).map((cell) => compactText(cell)));
      if (!rows.length) return state.y;

      const columnCount = Math.max(...rows.map((row) => row.length));
      const columnWidths = measureExportTableColumns(context, rows, columnCount, state.width);
      const lineHeight = 28;
      let y = state.y;

      setCanvasFont(context, "18px Georgia, serif", "#1f2420");
      rows.forEach((row, rowIndex) => {
        const cellLines = row.map((cell, index) => wrapCanvasText(context, cell, columnWidths[index] - 24));
        const rowHeight = Math.max(48, Math.max(...cellLines.map((lines) => lines.length)) * lineHeight + 20);
        let x = state.x;

        for (let index = 0; index < columnCount; index += 1) {
          if (!measureOnly) {
            context.fillStyle = rowIndex === 0 ? "rgba(29,109,115,.12)" : "#fdfaf2";
            context.fillRect(x, y, columnWidths[index], rowHeight);
            context.strokeStyle = "#d9d4c8";
            context.lineWidth = 1;
            context.strokeRect(x, y, columnWidths[index], rowHeight);
            context.fillStyle = "#1f2420";
            cellLines[index].forEach((line, lineIndex) => {
              context.fillText(line, x + 12, y + 12 + lineIndex * lineHeight);
            });
          }
          x += columnWidths[index];
        }

        y += rowHeight;
      });

      return y + 28;
    }

    function measureExportTableColumns(context, rows, columnCount, availableWidth) {
      setCanvasFont(context, "18px Georgia, serif", "#1f2420");
      const widths = Array.from({ length: columnCount }, (_, index) => {
        const maxText = Math.max(...rows.map((row) => context.measureText(row[index] || "").width));
        return Math.max(120, Math.min(360, maxText + 32));
      });
      const total = widths.reduce((sum, width) => sum + width, 0);
      if (total < availableWidth) {
        const extra = (availableWidth - total) / columnCount;
        return widths.map((width) => width + extra);
      }
      return widths;
    }

    function drawExportImage(context, image, state, measureOnly) {
      if (!image.complete || !image.naturalWidth || !image.naturalHeight) {
        return drawExportPlaceholder(context, createExportImagePlaceholder(image), state, measureOnly);
      }

      const scale = Math.min(1, state.width / image.naturalWidth);
      const width = Math.max(1, image.naturalWidth * scale);
      const height = Math.max(1, image.naturalHeight * scale);
      const x = state.x + (state.width - width) / 2;

      if (!measureOnly) {
        try {
          context.drawImage(image, x, state.y, width, height);
        } catch (_) {
          return drawExportPlaceholder(context, createExportImagePlaceholder(image), state, measureOnly);
        }
      }

      return state.y + height + 28;
    }

    function drawExportPlaceholder(context, element, state, measureOnly) {
      const title = element.querySelector("strong") ? element.querySelector("strong").textContent : "图片未嵌入";
      const details = Array.from(element.querySelectorAll("span")).map((span) => span.textContent).filter(Boolean).join(" ");
      const height = 190;

      if (!measureOnly) {
        context.fillStyle = "rgba(220,239,240,.48)";
        roundedCanvasRect(context, state.x, state.y, state.width, height, 8);
        context.fill();
        context.setLineDash([10, 8]);
        context.strokeStyle = "rgba(29,109,115,.55)";
        context.lineWidth = 2;
        context.stroke();
        context.setLineDash([]);

        setCanvasFont(context, "700 20px Georgia, serif", "#124f54");
        context.fillText(title, state.x + 24, state.y + 34);
        setCanvasFont(context, "14px Consolas, monospace", "#4e554f");
        drawWrappedCanvasText(context, details, state.x + 24, state.y + 72, state.width - 48, 22, false);
      }

      return state.y + height + 28;
    }

    function drawExportRule(context, state, measureOnly) {
      if (!measureOnly) {
        context.strokeStyle = "#d9d4c8";
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(state.x, state.y + 18);
        context.lineTo(state.x + state.width, state.y + 18);
        context.stroke();
      }
      return state.y + 48;
    }

    function setCanvasFont(context, font, color) {
      context.font = font;
      context.fillStyle = color;
      context.textBaseline = "top";
    }

    function drawWrappedCanvasText(context, text, x, y, maxWidth, lineHeight, measureOnly) {
      const lines = wrapCanvasText(context, text, maxWidth);
      lines.forEach((line, index) => {
        if (!measureOnly) context.fillText(line, x, y + index * lineHeight);
      });
      return y + lines.length * lineHeight;
    }

    function measureWrappedCanvasText(context, text, maxWidth, lineHeight) {
      return wrapCanvasText(context, text, maxWidth).length * lineHeight;
    }

    function wrapCanvasText(context, text, maxWidth) {
      const content = String(text || "").replace(/\s+/g, " ").trim();
      if (!content) return [""];

      const tokens = content.match(/[\u3400-\u9fff\uff00-\uffef]|[^\s\u3400-\u9fff\uff00-\uffef]+|\s+/g) || [content];
      const lines = [];
      let line = "";

      tokens.forEach((token) => {
        if (/^\s+$/.test(token)) {
          if (line) line += " ";
          return;
        }

        if (context.measureText(token).width > maxWidth) {
          const pieces = splitLongCanvasToken(context, token, maxWidth);
          pieces.forEach((piece) => {
            const candidatePiece = line ? line + piece : piece;
            if (context.measureText(candidatePiece).width <= maxWidth || !line) {
              line = candidatePiece;
              return;
            }
            lines.push(line.trimEnd());
            line = piece;
          });
          return;
        }

        const candidate = line ? line + token : token;
        if (context.measureText(candidate).width <= maxWidth || !line) {
          line = candidate;
          return;
        }

        lines.push(line.trimEnd());
        line = token;
      });

      if (line) lines.push(line.trimEnd());
      return lines.length ? lines : [""];
    }

    function wrapPreformattedCanvasText(context, text, maxWidth) {
      const content = String(text || "").replace(/\t/g, "    ");
      if (!content) return [" "];

      const lines = [];
      let line = "";

      for (const char of content) {
        const candidate = line + char;
        if (context.measureText(candidate).width <= maxWidth || !line) {
          line = candidate;
          continue;
        }
        lines.push(line);
        line = char;
      }

      if (line) lines.push(line);
      return lines.length ? lines : [" "];
    }

    function splitLongCanvasToken(context, token, maxWidth) {
      const pieces = [];
      let piece = "";

      for (const char of String(token)) {
        const candidate = piece + char;
        if (context.measureText(candidate).width <= maxWidth || !piece) {
          piece = candidate;
          continue;
        }
        pieces.push(piece);
        piece = char;
      }

      if (piece) pieces.push(piece);
      return pieces;
    }

    function roundedCanvasRect(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.lineTo(x + width - r, y);
      context.quadraticCurveTo(x + width, y, x + width, y + r);
      context.lineTo(x + width, y + height - r);
      context.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      context.lineTo(x + r, y + height);
      context.quadraticCurveTo(x, y + height, x, y + height - r);
      context.lineTo(x, y + r);
      context.quadraticCurveTo(x, y, x + r, y);
      context.closePath();
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        try {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("浏览器没有生成 PNG"));
          }, "image/png");
        } catch (error) {
          reject(error);
        }
      });
    }

    function exportBaseName() {
      return safeFilePart(activeFileName.replace(/\.(md|markdown|txt)$/i, "")) || "markdown";
    }

    function safeFilePart(value) {
      return String(value || "")
        .replace(/[\\/:*?"<>|]+/g, "-")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        .slice(0, 48);
    }

    function friendlyExportError(error) {
      const message = error && error.message ? error.message : "未知错误";
      if (isCanvasSecurityError(error)) {
        return "浏览器阻止了外部图片写入 Canvas，请改用本地同源图片或 data:image 内嵌图片";
      }
      return message;
    }

    function isCanvasSecurityError(error) {
      const name = error && error.name ? error.name : "";
      const message = error && error.message ? error.message : "";
      return /SecurityError/i.test(name) || /tainted|canvas/i.test(message);
    }

    function renderNow() {
      preview.innerHTML = markdownToHtml(editor.value);
      setupMermaidToggles(preview);
      setupPreviewImages(preview);
      updateMeta();
    }

    function setupMermaidToggles(root) {
      const diagrams = Array.from((root || document).querySelectorAll(".mermaid-diagram"));

      diagrams.forEach((diagram) => {
        const button = diagram.querySelector(".mermaid-toggle");
        if (!button) return;

        const sync = () => {
          const expanded = diagram.classList.contains("expanded");
          const hasOverflow = diagram.scrollHeight > diagram.clientHeight + 1 || diagram.scrollWidth > diagram.clientWidth + 1;
          diagram.classList.toggle("has-overflow", hasOverflow);
          button.textContent = expanded ? "收起" : "展开";
          button.setAttribute("aria-expanded", expanded ? "true" : "false");
        };

        button.addEventListener("click", (event) => {
          event.preventDefault();
          diagram.classList.toggle("expanded");
          sync();
        });

        if ("requestAnimationFrame" in window) {
          window.requestAnimationFrame(sync);
        } else {
          window.setTimeout(sync, 0);
        }
      });
    }

    function setupPreviewImages(root) {
      Array.from((root || document).querySelectorAll("img")).forEach((image) => {
        image.tabIndex = 0;
        image.addEventListener("click", (event) => {
          event.preventDefault();
          openImageViewer(image);
        });
        image.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          openImageViewer(image);
        });
      });
    }

    function openImageViewer(image) {
      const source = image.currentSrc || image.src;
      if (!source) return;

      imageViewerCaption.textContent = image.alt || image.getAttribute("src") || "图片";
      imageViewerImage.onload = fitImageViewer;
      imageViewerImage.src = source;
      imageViewerImage.alt = image.alt || "";
      imageViewer.classList.add("visible");
      if (imageViewerImage.complete) window.requestAnimationFrame(fitImageViewer);
    }

    function closeImageViewer() {
      imageViewer.classList.remove("visible");
      imageViewerImage.removeAttribute("src");
      imageViewerDragging = false;
      imageViewerStage.classList.remove("dragging");
    }

    function zoomImageViewer(multiplier) {
      setImageViewerScale(imageViewerScale * multiplier);
    }

    function setImageViewerScale(scale) {
      imageViewerScale = Math.min(8, Math.max(0.1, scale));
      applyImageViewerTransform();
    }

    function fitImageViewer() {
      const naturalWidth = imageViewerImage.naturalWidth || imageViewerImage.width || 1;
      const naturalHeight = imageViewerImage.naturalHeight || imageViewerImage.height || 1;
      const stageWidth = Math.max(1, imageViewerStage.clientWidth - 48);
      const stageHeight = Math.max(1, imageViewerStage.clientHeight - 48);
      const scale = Math.min(stageWidth / naturalWidth, stageHeight / naturalHeight, 1);
      imageViewerScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
      imageViewerX = 0;
      imageViewerY = 0;
      applyImageViewerTransform();
    }

    function applyImageViewerTransform() {
      imageViewerImage.style.transform = `translate(calc(-50% + ${imageViewerX}px), calc(-50% + ${imageViewerY}px)) scale(${imageViewerScale})`;
      imageViewerZoom.textContent = `${Math.round(imageViewerScale * 100)}%`;
    }

    function endImageViewerDrag(event) {
      if (!imageViewerDragging) return;
      imageViewerDragging = false;
      imageViewerStage.classList.remove("dragging");
      if (event && typeof imageViewerStage.releasePointerCapture === "function") {
        try {
          imageViewerStage.releasePointerCapture(event.pointerId);
        } catch (_) {
          // Pointer capture may already be released by the browser.
        }
      }
    }

    function setView(view) {
      currentView = view;
      workspace.dataset.view = view;
      document.querySelectorAll("[data-view-button]").forEach((button) => {
        button.classList.toggle("active", button.dataset.viewButton === view);
      });
    }

    function updateMeta(message) {
      if (message) statusEl.textContent = message;
      const text = editor.value;
      const words = (text.match(/[\p{L}\p{N}_-]+/gu) || []).length;
      statsEl.textContent = `${words} 词 · ${text.length} 字符`;
      dirtyDot.classList.toggle("visible", text !== savedText);
    }

    function showError(error) {
      console.error(error);
      statusEl.textContent = error && error.message ? error.message : "操作失败";
    }

    function hasFiles(event) {
      return Array.from(event.dataTransfer && event.dataTransfer.types || []).includes("Files");
    }

    function downloadBlob(content, name, type) {
      downloadBlobFile(new Blob([content], { type }), name || "document.md");
    }

    function downloadBlobFile(blob, name) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = name || "document.md";
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function markdownToHtml(markdown) {
      const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
      const html = [];
      let index = 0;

      while (index < lines.length) {
        const line = lines[index];

        if (/^\s*$/.test(line)) {
          index += 1;
          continue;
        }

        const fence = line.match(/^```([A-Za-z0-9_-]+)?\s*$/);
        if (fence) {
          const code = [];
          index += 1;
          while (index < lines.length && !/^```\s*$/.test(lines[index])) {
            code.push(lines[index]);
            index += 1;
          }
          if (index < lines.length) index += 1;
          if ((fence[1] || "").toLowerCase() === "mermaid") {
            html.push(renderMermaidBlock(code.join("\n")));
            continue;
          }
          const lang = fence[1] ? ` data-lang="${escapeHtml(fence[1])}"` : "";
          html.push(`<pre${lang}><code>${escapeHtml(code.join("\n"))}</code></pre>`);
          continue;
        }

        if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
          html.push("<hr>");
          index += 1;
          continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          const level = heading[1].length;
          html.push(`<h${level}>${inlineMarkdown(heading[2].trim())}</h${level}>`);
          index += 1;
          continue;
        }

        if (isTableStart(lines, index)) {
          const tableLines = [];
          tableLines.push(lines[index], lines[index + 1]);
          index += 2;
          while (index < lines.length && /\|/.test(lines[index]) && !/^\s*$/.test(lines[index])) {
            tableLines.push(lines[index]);
            index += 1;
          }
          html.push(renderTable(tableLines));
          continue;
        }

        if (/^\s*>\s?/.test(line)) {
          const quote = [];
          while (index < lines.length && /^\s*>\s?/.test(lines[index])) {
            quote.push(lines[index].replace(/^\s*>\s?/, ""));
            index += 1;
          }
          html.push(`<blockquote>${markdownToHtml(quote.join("\n"))}</blockquote>`);
          continue;
        }

        if (/^\s*[-*+]\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\s*[-*+]\s+/.test(lines[index])) {
            items.push(lines[index].replace(/^\s*[-*+]\s+/, ""));
            index += 1;
          }
          html.push(`<ul>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}</ul>`);
          continue;
        }

        if (/^\s*\d+[.)]\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\s*\d+[.)]\s+/.test(lines[index])) {
            items.push(lines[index].replace(/^\s*\d+[.)]\s+/, ""));
            index += 1;
          }
          html.push(`<ol>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}</ol>`);
          continue;
        }

        const paragraph = [];
        while (
          index < lines.length &&
          !/^\s*$/.test(lines[index]) &&
          !/^```/.test(lines[index]) &&
          !/^(#{1,6})\s+/.test(lines[index]) &&
          !/^\s*[-*+]\s+/.test(lines[index]) &&
          !/^\s*\d+[.)]\s+/.test(lines[index]) &&
          !/^\s*>\s?/.test(lines[index]) &&
          !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[index]) &&
          !isTableStart(lines, index)
        ) {
          paragraph.push(lines[index]);
          index += 1;
        }
        html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
      }

      return html.join("\n");
    }

    function renderMermaidBlock(source) {
      const diagram = parseMermaidFlowchart(source);
      if (!diagram) {
        return `<pre data-lang="mermaid"><code>${escapeHtml(source)}</code></pre>`;
      }
      return renderFlowchartSvg(diagram);
    }

    function parseMermaidFlowchart(source) {
      const lines = source.replace(/\r\n?/g, "\n").split("\n");
      const diagram = {
        direction: "TD",
        nodes: new Map(),
        edges: [],
        classDefs: new Map(),
        groups: new Map(),
        groupOrder: [],
        order: []
      };
      const activeGroups = [];

      for (const rawLine of lines) {
        const line = rawLine.trim().replace(/;$/, "");
        if (!line || line.startsWith("%%")) continue;

        const header = line.match(/^(?:flowchart|graph)\s+(TD|TB|BT|LR|RL)\b/i);
        if (header) {
          diagram.direction = header[1].toUpperCase();
          continue;
        }

        const subgraph = readMermaidSubgraph(line, diagram.groupOrder.length + 1);
        if (subgraph) {
          subgraph.parentId = activeGroups[activeGroups.length - 1] || "";
          diagram.groups.set(subgraph.id, subgraph);
          diagram.groupOrder.push(subgraph.id);
          activeGroups.push(subgraph.id);
          continue;
        }

        if (/^end$/i.test(line)) {
          activeGroups.pop();
          continue;
        }

        const classDef = line.match(/^classDef\s+([A-Za-z0-9_-]+)\s+(.+)$/);
        if (classDef) {
          diagram.classDefs.set(classDef[1], parseMermaidStyle(classDef[2]));
          continue;
        }

        const styleLine = line.match(/^style\s+([A-Za-z0-9_-]+)\s+(.+)$/i);
        if (styleLine) {
          const node = ensureMermaidNode(diagram, styleLine[1]);
          node.style = { ...node.style, ...parseMermaidStyle(styleLine[2]) };
          addMermaidNodesToGroups(diagram, [styleLine[1]], activeGroups);
          continue;
        }

        const classLine = line.match(/^class\s+(.+?)\s+([A-Za-z0-9_-]+)$/);
        if (classLine) {
          const ids = classLine[1].split(",").map((id) => id.trim()).filter(Boolean);
          ids.forEach((id) => {
            ensureMermaidNode(diagram, id).className = classLine[2];
          });
          addMermaidNodesToGroups(diagram, ids, activeGroups);
          continue;
        }

        const sourceNode = readMermaidNodeToken(line, 0);
        if (!sourceNode) continue;
        let currentNode = sourceNode;
        let cursor = sourceNode.end;
        let hasEdge = false;

        while (true) {
          const edge = readMermaidEdgeToken(line, cursor);
          if (!edge) break;

          const targetNode = readMermaidNodeToken(line, edge.end);
          if (!targetNode) break;
          if (!diagram.groups.has(currentNode.id)) mergeMermaidNode(diagram, currentNode);
          if (!diagram.groups.has(targetNode.id)) mergeMermaidNode(diagram, targetNode);
          addMermaidNodesToGroups(diagram, [currentNode.id, targetNode.id].filter((id) => !diagram.groups.has(id)), activeGroups);
          diagram.edges.push({
            from: currentNode.id,
            to: targetNode.id,
            label: edge.label,
            dotted: edge.dotted
          });
          currentNode = targetNode;
          cursor = targetNode.end;
          hasEdge = true;
        }

        if (!hasEdge) {
          if (!diagram.groups.has(sourceNode.id)) {
            mergeMermaidNode(diagram, sourceNode);
            addMermaidNodesToGroups(diagram, [sourceNode.id], activeGroups);
          }
        }
      }

      if (!diagram.nodes.size || !diagram.edges.length) return null;
      return diagram;
    }

    function readMermaidSubgraph(line, fallbackIndex) {
      const match = line.match(/^subgraph\s+(.+)$/i);
      if (!match) return null;

      const source = match[1].trim();
      const explicit = source.match(/^([A-Za-z0-9_-]+)\s*[\[\(\{](.*)[\]\)\}]\s*$/);
      if (explicit) {
        return {
          id: explicit[1],
          label: normalizeMermaidLabel(explicit[2]) || explicit[1],
          nodeIds: new Set(),
          parentId: ""
        };
      }

      const id = /^[A-Za-z0-9_-]+$/.test(source) ? source : `subgraph_${fallbackIndex}`;
      return {
        id,
        label: normalizeMermaidLabel(source) || id,
        nodeIds: new Set(),
        parentId: ""
      };
    }

    function parseMermaidStyle(styleText) {
      const style = {};
      styleText.split(",").forEach((part) => {
        const pair = part.split(":");
        if (pair.length < 2) return;
        const key = pair.shift().trim();
        const value = pair.join(":").trim();
        if (["fill", "stroke", "color"].includes(key)) style[key] = value;
      });
      return style;
    }

    function addMermaidNodesToGroups(diagram, nodeIds, activeGroups) {
      if (!activeGroups.length) return;
      activeGroups.forEach((groupId) => {
        const group = diagram.groups.get(groupId);
        if (!group) return;
        nodeIds.forEach((id) => group.nodeIds.add(id));
      });
    }

    function readMermaidNodeToken(text, start) {
      let index = skipMermaidSpaces(text, start);
      const idStart = index;
      while (index < text.length && /[A-Za-z0-9_-]/.test(text[index])) index += 1;
      if (index === idStart) return null;

      const id = text.slice(idStart, index);
      let label = "";
      const opener = text[index];
      const closer = opener === "[" ? "]" : opener === "(" ? ")" : opener === "{" ? "}" : "";
      if (closer) {
        index += 1;
        const labelStart = index;
        let depth = 1;
        while (index < text.length && depth > 0) {
          if (text[index] === opener) depth += 1;
          if (text[index] === closer) depth -= 1;
          if (depth > 0) index += 1;
        }
        label = normalizeMermaidLabel(text.slice(labelStart, index));
        if (text[index] === closer) index += 1;
      }

      let className = "";
      if (text.slice(index, index + 3) === ":::") {
        index += 3;
        const classStart = index;
        while (index < text.length && /[A-Za-z0-9_-]/.test(text[index])) index += 1;
        className = text.slice(classStart, index);
      }

      return { id, label: label || id, className, end: index };
    }

    function readMermaidEdgeToken(text, start) {
      let index = skipMermaidSpaces(text, start);
      const chunk = text.slice(index);
      let match = chunk.match(/^-->\|([^|]*)\|/);
      if (match) return { label: match[1].trim(), dotted: false, end: index + match[0].length };

      match = chunk.match(/^-\.(.*?)\.->/);
      if (match) return { label: match[1].trim(), dotted: true, end: index + match[0].length };

      if (chunk.startsWith("-.->")) return { label: "", dotted: true, end: index + 4 };
      if (chunk.startsWith("-->")) return { label: "", dotted: false, end: index + 3 };
      if (chunk.startsWith("==>")) return { label: "", dotted: false, end: index + 3 };

      match = chunk.match(/^--\s*(.*?)\s*-->/);
      if (match) return { label: match[1].trim(), dotted: false, end: index + match[0].length };
      return null;
    }

    function skipMermaidSpaces(text, index) {
      while (index < text.length && /\s/.test(text[index])) index += 1;
      return index;
    }

    function mergeMermaidNode(diagram, token) {
      const node = ensureMermaidNode(diagram, token.id);
      if (token.label && token.label !== token.id) node.label = token.label;
      if (token.className) node.className = token.className;
      return node;
    }

    function ensureMermaidNode(diagram, id) {
      if (!diagram.nodes.has(id)) {
        diagram.nodes.set(id, { id, label: id, className: "", style: {} });
        diagram.order.push(id);
      }
      return diagram.nodes.get(id);
    }

    function renderFlowchartSvg(diagram) {
      const layout = layoutMermaidFlowchart(diagram);
      const groupFrames = layout.groups.map(renderMermaidGroup).join("");
      const edgePaths = diagram.edges.map((edge, index) => renderMermaidEdge(edge, index, layout)).join("");
      const nodeGroups = layout.nodes.map((node) => renderMermaidNode(node, diagram.classDefs)).join("");

      return `<figure class="mermaid-diagram"><button type="button" class="mermaid-toggle" aria-expanded="false">展开</button><svg width="${layout.width}" height="${layout.height}" viewBox="0 0 ${layout.width} ${layout.height}" role="img" aria-label="Mermaid flowchart" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="mermaidArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f5e5a"></path>
  </marker>
</defs>
${groupFrames}
${edgePaths}
${nodeGroups}
</svg></figure>`;
    }

    function layoutMermaidFlowchart(diagram) {
      if (diagram.groups.size) return layoutMermaidGroupedFlowchart(diagram);
      return layoutMermaidUngroupedFlowchart(diagram);
    }

    function layoutMermaidUngroupedFlowchart(diagram) {
      const levels = assignMermaidLevels(diagram);
      const rows = [];
      const gapX = 34;
      const gapY = 48;
      const margin = 24;

      diagram.order.forEach((id) => {
        const node = diagram.nodes.get(id);
        const item = createMermaidLayoutNode(node);
        const level = levels.get(id) || 0;
        if (!rows[level]) rows[level] = [];
        rows[level].push(item);
      });

      let canvasWidth = 0;
      let canvasHeight = margin;
      rows.forEach((row) => {
        const rowWidth = row.reduce((sum, node) => sum + node.width, 0) + gapX * Math.max(0, row.length - 1);
        const rowHeight = Math.max(...row.map((node) => node.height));
        canvasWidth = Math.max(canvasWidth, rowWidth + margin * 2);
        row.forEach((node) => {
          node.y = canvasHeight + (rowHeight - node.height) / 2;
        });
        canvasHeight += rowHeight + gapY;
      });
      canvasHeight = Math.max(140, canvasHeight - gapY + margin);

      rows.forEach((row) => {
        const rowWidth = row.reduce((sum, node) => sum + node.width, 0) + gapX * Math.max(0, row.length - 1);
        let x = (canvasWidth - rowWidth) / 2;
        row.forEach((node) => {
          node.x = x;
          x += node.width + gapX;
        });
      });

      const nodes = rows.flat();
      const nodeMap = new Map(nodes.map((node) => [node.id, node]));
      const groups = layoutMermaidGroups(diagram, nodeMap);
      const outerPadding = 8;
      const minX = Math.min(...nodes.map((node) => node.x), ...groups.map((group) => group.x), 0);
      const minY = Math.min(...nodes.map((node) => node.y), ...groups.map((group) => group.y), 0);
      const maxX = Math.max(...nodes.map((node) => node.x + node.width), ...groups.map((group) => group.x + group.width), canvasWidth);
      const maxY = Math.max(...nodes.map((node) => node.y + node.height), ...groups.map((group) => group.y + group.height), canvasHeight);
      const offsetX = minX < outerPadding ? outerPadding - minX : 0;
      const offsetY = minY < outerPadding ? outerPadding - minY : 0;
      if (offsetX || offsetY) {
        nodes.forEach((node) => {
          node.x += offsetX;
          node.y += offsetY;
        });
        groups.forEach((group) => {
          group.x += offsetX;
          group.y += offsetY;
        });
      }
      return {
        width: Math.round(Math.max(canvasWidth + offsetX, maxX + offsetX + outerPadding)),
        height: Math.round(Math.max(canvasHeight + offsetY, maxY + offsetY + outerPadding)),
        nodes,
        nodeMap,
        groups,
        groupMap: new Map(groups.map((group) => [group.id, group]))
      };
    }

    function layoutMermaidGroups(diagram, nodeMap) {
      const layouts = new Map();
      [...diagram.groupOrder].reverse().forEach((id) => {
        const group = diagram.groups.get(id);
        if (!group) return;

        const nodeBoxes = [...group.nodeIds]
          .map((nodeId) => nodeMap.get(nodeId))
          .filter(Boolean)
          .map((node) => ({
            x: node.x,
            y: node.y,
            width: node.width,
            height: node.height
          }));
        const childBoxes = [...layouts.values()]
          .filter((child) => child.parentId === id)
          .map((child) => ({
            x: child.x,
            y: child.y,
            width: child.width,
            height: child.height
          }));
        const boxes = [...nodeBoxes, ...childBoxes];
        if (!boxes.length) return;

        let lines = mermaidLabelLines(group.label);
        if (!lines.length) lines = [group.id];
        const minX = Math.min(...boxes.map((box) => box.x));
        const minY = Math.min(...boxes.map((box) => box.y));
        const maxX = Math.max(...boxes.map((box) => box.x + box.width));
        const maxY = Math.max(...boxes.map((box) => box.y + box.height));
        const labelWidth = Math.max(...lines.map(estimateTextWidth)) + 28;
        const labelHeight = Math.max(24, lines.length * 18 + 8);
        const paddingX = 18;
        const paddingBottom = 16;
        const paddingTop = labelHeight + 12;
        let x = minX - paddingX;
        let width = maxX - minX + paddingX * 2;

        if (labelWidth > width) {
          const extraWidth = labelWidth - width;
          x -= extraWidth / 2;
          width = labelWidth;
        }

        layouts.set(id, {
          id,
          parentId: group.parentId,
          lines,
          x,
          y: minY - paddingTop,
          width,
          height: maxY - minY + paddingTop + paddingBottom
        });
      });

      return diagram.groupOrder.map((id) => layouts.get(id)).filter(Boolean);
    }

    function layoutMermaidGroupedFlowchart(diagram) {
      const topGroups = diagram.groupOrder
        .map((id) => diagram.groups.get(id))
        .filter((group) => group && !group.parentId);
      const ownerByNode = new Map();

      diagram.order.forEach((nodeId) => {
        const owner = topGroups.find((group) => group.nodeIds.has(nodeId));
        if (owner) ownerByNode.set(nodeId, owner.id);
      });

      const itemMap = new Map();
      const itemOrder = [];
      const addItem = (id, item) => {
        if (itemMap.has(id)) return;
        itemMap.set(id, item);
        itemOrder.push(id);
      };

      diagram.order.forEach((nodeId) => {
        const ownerId = ownerByNode.get(nodeId);
        if (ownerId) {
          addItem(`group:${ownerId}`, createMermaidGroupLayoutItem(diagram, ownerId, ownerByNode));
          return;
        }
        addItem(`node:${nodeId}`, {
          id: `node:${nodeId}`,
          type: "node",
          sourceId: nodeId,
          width: 0,
          height: 0,
          node: createMermaidLayoutNode(diagram.nodes.get(nodeId))
        });
      });

      topGroups.forEach((group) => {
        addItem(`group:${group.id}`, createMermaidGroupLayoutItem(diagram, group.id, ownerByNode));
      });

      itemMap.forEach((item) => {
        if (item.type === "node") {
          item.width = item.node.width;
          item.height = item.node.height;
        }
      });

      const itemEdges = [];
      diagram.edges.forEach((edge) => {
        const from = mermaidItemIdForEndpoint(diagram, ownerByNode, edge.from);
        const to = mermaidItemIdForEndpoint(diagram, ownerByNode, edge.to);
        if (from && to && from !== to && itemMap.has(from) && itemMap.has(to)) {
          itemEdges.push({ from, to });
        }
      });

      const levels = assignMermaidLevelsForIds(itemOrder, itemEdges);
      const rows = [];
      const gapX = 64;
      const gapY = 86;
      const margin = 28;

      itemOrder.forEach((id) => {
        const item = itemMap.get(id);
        const level = levels.get(id) || 0;
        if (!rows[level]) rows[level] = [];
        rows[level].push(item);
      });

      let canvasWidth = 0;
      let canvasHeight = margin;
      rows.forEach((row) => {
        const rowWidth = row.reduce((sum, item) => sum + item.width, 0) + gapX * Math.max(0, row.length - 1);
        const rowHeight = Math.max(...row.map((item) => item.height));
        canvasWidth = Math.max(canvasWidth, rowWidth + margin * 2);
        row.forEach((item) => {
          item.y = canvasHeight + (rowHeight - item.height) / 2;
        });
        canvasHeight += rowHeight + gapY;
      });
      canvasHeight = Math.max(140, canvasHeight - gapY + margin);

      rows.forEach((row) => {
        const rowWidth = row.reduce((sum, item) => sum + item.width, 0) + gapX * Math.max(0, row.length - 1);
        let x = (canvasWidth - rowWidth) / 2;
        row.forEach((item) => {
          item.x = x;
          x += item.width + gapX;
        });
      });

      const nodes = [];
      const groups = [];
      itemOrder.forEach((id) => {
        const item = itemMap.get(id);
        if (item.type === "node") {
          item.node.x = item.x;
          item.node.y = item.y;
          nodes.push(item.node);
          return;
        }

        groups.push({
          id: item.sourceId,
          parentId: "",
          lines: item.lines,
          x: item.x,
          y: item.y,
          width: item.width,
          height: item.height
        });
        item.nodes.forEach((node) => {
          nodes.push({
            ...node,
            x: item.x + item.innerX + node.x,
            y: item.y + item.innerY + node.y
          });
        });
      });

      const nodeMap = new Map(nodes.map((node) => [node.id, node]));
      const groupMap = new Map(groups.map((group) => [group.id, group]));
      const maxX = Math.max(...nodes.map((node) => node.x + node.width), ...groups.map((group) => group.x + group.width), canvasWidth);
      const maxY = Math.max(...nodes.map((node) => node.y + node.height), ...groups.map((group) => group.y + group.height), canvasHeight);

      return {
        width: Math.round(maxX + margin),
        height: Math.round(maxY + margin),
        nodes,
        nodeMap,
        groups,
        groupMap
      };
    }

    function createMermaidGroupLayoutItem(diagram, groupId, ownerByNode) {
      const group = diagram.groups.get(groupId);
      const nodeIds = diagram.order.filter((nodeId) => ownerByNode.get(nodeId) === groupId);
      const internalEdges = diagram.edges.filter((edge) => nodeIds.includes(edge.from) && nodeIds.includes(edge.to));
      const inner = layoutMermaidNodeCollection(diagram, nodeIds, internalEdges);
      const labelLines = wrapMermaidLabelLines(group ? group.label : groupId, 420);
      const labelWidth = Math.max(...labelLines.map(estimateTextWidth), estimateTextWidth(groupId)) + 34;
      const labelHeight = Math.max(26, labelLines.length * 18 + 10);
      const paddingX = 24;
      const paddingBottom = 20;
      const paddingTop = labelHeight + 18;
      const width = Math.max(inner.width + paddingX * 2, labelWidth, 180);
      const height = Math.max(inner.height + paddingTop + paddingBottom, labelHeight + 80);

      return {
        id: `group:${groupId}`,
        type: "group",
        sourceId: groupId,
        lines: labelLines,
        width,
        height,
        innerX: (width - inner.width) / 2,
        innerY: paddingTop,
        nodes: inner.nodes
      };
    }

    function layoutMermaidNodeCollection(diagram, ids, edges) {
      const rows = [];
      const gapX = 40;
      const gapY = 52;
      const levels = assignMermaidLevelsForIds(ids, edges);

      ids.forEach((id) => {
        const node = diagram.nodes.get(id);
        if (!node) return;
        const item = createMermaidLayoutNode(node);
        const level = levels.get(id) || 0;
        if (!rows[level]) rows[level] = [];
        rows[level].push(item);
      });

      if (!rows.length) return { width: 132, height: 44, nodes: [] };

      let width = 0;
      let height = 0;
      rows.forEach((row) => {
        const rowWidth = row.reduce((sum, node) => sum + node.width, 0) + gapX * Math.max(0, row.length - 1);
        const rowHeight = Math.max(...row.map((node) => node.height));
        width = Math.max(width, rowWidth);
        row.forEach((node) => {
          node.y = height + (rowHeight - node.height) / 2;
        });
        height += rowHeight + gapY;
      });
      height = Math.max(44, height - gapY);

      rows.forEach((row) => {
        const rowWidth = row.reduce((sum, node) => sum + node.width, 0) + gapX * Math.max(0, row.length - 1);
        let x = (width - rowWidth) / 2;
        row.forEach((node) => {
          node.x = x;
          x += node.width + gapX;
        });
      });

      return { width, height, nodes: rows.flat() };
    }

    function createMermaidLayoutNode(node) {
      const lines = wrapMermaidLabelLines(node.label, 300);
      const width = Math.max(126, Math.min(340, Math.max(...lines.map(estimateTextWidth)) + 32));
      const height = Math.max(44, lines.length * 19 + 22);
      return { ...node, lines, width, height, x: 0, y: 0 };
    }

    function mermaidItemIdForEndpoint(diagram, ownerByNode, id) {
      if (diagram.groups.has(id)) return `group:${topMermaidGroupId(diagram, id)}`;
      if (!diagram.nodes.has(id)) return "";
      const ownerId = ownerByNode.get(id);
      return ownerId ? `group:${ownerId}` : `node:${id}`;
    }

    function topMermaidGroupId(diagram, id) {
      let group = diagram.groups.get(id);
      while (group && group.parentId && diagram.groups.has(group.parentId)) {
        group = diagram.groups.get(group.parentId);
      }
      return group ? group.id : id;
    }

    function assignMermaidLevels(diagram) {
      return assignMermaidLevelsForIds(diagram.order, diagram.edges);
    }

    function assignMermaidLevelsForIds(ids, edges) {
      const outgoing = new Map();
      const incoming = new Map();
      ids.forEach((id) => {
        outgoing.set(id, []);
        incoming.set(id, 0);
      });
      edges.forEach((edge) => {
        if (!outgoing.has(edge.from) || !incoming.has(edge.to)) return;
        outgoing.get(edge.from).push(edge.to);
        incoming.set(edge.to, incoming.get(edge.to) + 1);
      });

      const levels = new Map();
      const roots = ids.filter((id) => incoming.get(id) === 0);
      const starters = roots.length ? roots : [ids[0]];

      starters.forEach((id) => visitMermaidLevel(id, 0, new Set(), outgoing, levels));
      ids.forEach((id) => {
        if (!levels.has(id)) visitMermaidLevel(id, 0, new Set(), outgoing, levels);
      });

      return levels;
    }

    function visitMermaidLevel(id, level, stack, outgoing, levels) {
      if (stack.has(id)) return;
      if (!levels.has(id) || level > levels.get(id)) levels.set(id, level);
      const nextStack = new Set(stack);
      nextStack.add(id);
      (outgoing.get(id) || []).forEach((nextId) => visitMermaidLevel(nextId, level + 1, nextStack, outgoing, levels));
    }

    function renderMermaidNode(node, classDefs) {
      const style = { ...(classDefs.get(node.className) || {}), ...(node.style || {}) };
      const fill = safeMermaidColor(style.fill, "#fffdf8");
      const stroke = safeMermaidColor(style.stroke, "#5f5e5a");
      const color = safeMermaidColor(style.color, "#2c2c2a");
      const textY = node.y + node.height / 2 - ((node.lines.length - 1) * 9.5);
      const lines = node.lines.map((line, index) => {
        return `<tspan x="${node.x + node.width / 2}" y="${textY + index * 19}">${escapeHtml(line)}</tspan>`;
      }).join("");

      return `<g>
<rect x="${node.x}" y="${node.y}" width="${node.width}" height="${node.height}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="2"></rect>
<text text-anchor="middle" dominant-baseline="middle" fill="${color}" font-size="13" font-weight="650">${lines}</text>
</g>`;
    }

    function renderMermaidGroup(group) {
      const label = group.lines.map((line, index) => {
        return `<tspan x="${group.x + 14}" y="${group.y + 18 + index * 18}">${escapeHtml(line)}</tspan>`;
      }).join("");

      return `<g>
<rect x="${group.x}" y="${group.y}" width="${group.width}" height="${group.height}" rx="8" fill="#f7fbf6" stroke="#b9c7bf" stroke-width="1.5"></rect>
<text text-anchor="start" fill="#3b5951" font-size="12" font-weight="700">${label}</text>
</g>`;
    }

    function renderMermaidEdge(edge, index, layout) {
      const from = mermaidEndpointBox(edge.from, layout);
      const to = mermaidEndpointBox(edge.to, layout);
      if (!from || !to) return "";

      const backEdge = to.y <= from.y;
      let path = "";
      let labelX = 0;
      let labelY = 0;

      if (backEdge) {
        const x1 = from.x;
        const y1 = from.y + from.height / 2;
        const x2 = to.x;
        const y2 = to.y + to.height / 2;
        const controlX = Math.min(x1, x2) - 62;
        path = `M ${x1} ${y1} C ${controlX} ${y1}, ${controlX} ${y2}, ${x2} ${y2}`;
        labelX = controlX;
        labelY = (y1 + y2) / 2;
      } else {
        const x1 = from.x + from.width / 2;
        const y1 = from.y + from.height;
        const x2 = to.x + to.width / 2;
        const y2 = to.y;
        const midY = (y1 + y2) / 2;
        path = `M ${x1} ${y1} L ${x1} ${midY} L ${x2} ${midY} L ${x2} ${y2}`;
        labelX = (x1 + x2) / 2;
        labelY = midY - 8;
      }

      const dash = edge.dotted ? ' stroke-dasharray="6 6"' : "";
      const label = edge.label ? renderMermaidEdgeLabel(edge.label, labelX, labelY) : "";
      return `<path d="${path}" fill="none" stroke="#5f5e5a" stroke-width="2"${dash} marker-end="url(#mermaidArrow)"></path>${label}`;
    }

    function mermaidEndpointBox(id, layout) {
      return layout.nodeMap.get(id) || (layout.groupMap && layout.groupMap.get(id));
    }

    function renderMermaidEdgeLabel(label, x, y) {
      const safeLabel = escapeHtml(label);
      const width = Math.max(56, Math.min(220, estimateTextWidth(label) + 18));
      return `<g>
<rect x="${x - width / 2}" y="${y - 16}" width="${width}" height="24" rx="6" fill="#fdfaf2" stroke="#d9d4c8"></rect>
<text x="${x}" y="${y - 3}" text-anchor="middle" dominant-baseline="middle" fill="#4e554f" font-size="13">${safeLabel}</text>
</g>`;
    }

    function mermaidLabelLines(label) {
      return normalizeMermaidLabel(label)
        .replace(/<br\s*\/?>/gi, "\n")
        .split(/\n+/)
        .map((line) => line.trim())
        .filter(Boolean);
    }

    function wrapMermaidLabelLines(label, maxWidth) {
      return mermaidLabelLines(label).flatMap((line) => wrapMermaidTextLine(line, maxWidth));
    }

    function wrapMermaidTextLine(line, maxWidth) {
      const text = String(line || "").trim();
      if (!text) return [""];

      const tokens = text.match(/[\u3400-\u9fff\uff00-\uffef]|[^\s\u3400-\u9fff\uff00-\uffef]+|\s+/g) || [text];
      const lines = [];
      let current = "";

      tokens.forEach((token) => {
        if (/^\s+$/.test(token)) {
          if (current) current += " ";
          return;
        }

        if (estimateTextWidth(token) > maxWidth) {
          splitMermaidTextToken(token, maxWidth).forEach((piece) => {
            const candidatePiece = current ? current + piece : piece;
            if (estimateTextWidth(candidatePiece) <= maxWidth || !current) {
              current = candidatePiece;
              return;
            }
            lines.push(current.trimEnd());
            current = piece;
          });
          return;
        }

        const candidate = current ? current + token : token;
        if (estimateTextWidth(candidate) <= maxWidth || !current) {
          current = candidate;
          return;
        }

        lines.push(current.trimEnd());
        current = token;
      });

      if (current) lines.push(current.trimEnd());
      return lines.length ? lines : [text];
    }

    function splitMermaidTextToken(token, maxWidth) {
      const pieces = [];
      let piece = "";

      for (const char of String(token)) {
        const candidate = piece + char;
        if (estimateTextWidth(candidate) <= maxWidth || !piece) {
          piece = candidate;
          continue;
        }
        pieces.push(piece);
        piece = char;
      }

      if (piece) pieces.push(piece);
      return pieces;
    }

    function normalizeMermaidLabel(label) {
      let value = String(label || "").trim();
      let changed = true;

      while (changed && value.length > 1) {
        changed = false;
        const first = value[0];
        const last = value[value.length - 1];
        if ((first === "\"" && last === "\"") || (first === "'" && last === "'")) {
          value = value.slice(1, -1).trim();
          changed = true;
          continue;
        }
        const shapePair = (first === "[" && last === "]") || (first === "(" && last === ")") || (first === "{" && last === "}");
        if (shapePair) {
          value = value.slice(1, -1).trim();
          changed = true;
        }
      }

      return value.replace(/\\"/g, "\"").replace(/\\'/g, "'");
    }

    function estimateTextWidth(text) {
      let width = 0;
      for (const char of String(text || "")) {
        width += /[\u3400-\u9fff\uff00-\uffef]/.test(char) ? 14 : 7.4;
      }
      return width;
    }

    function safeMermaidColor(value, fallback) {
      const color = String(value || "").trim();
      if (/^#[0-9a-f]{3,8}$/i.test(color)) return color;
      if (/^(?:rgb|rgba|hsl|hsla)\([0-9.,%\s]+\)$/i.test(color)) return escapeAttribute(color);
      if (/^[a-z]+$/i.test(color)) return escapeAttribute(color);
      return fallback;
    }

    function isTableStart(lines, index) {
      if (index + 1 >= lines.length) return false;
      return /\|/.test(lines[index]) && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[index + 1]);
    }

    function renderTable(lines) {
      const header = splitTableRow(lines[0]);
      const body = lines.slice(2).map(splitTableRow);
      const headHtml = `<thead><tr>${header.map((cell) => `<th>${inlineMarkdown(cell.trim())}</th>`).join("")}</tr></thead>`;
      const bodyHtml = `<tbody>${body.map((row) => `<tr>${row.map((cell) => `<td>${inlineMarkdown(cell.trim())}</td>`).join("")}</tr>`).join("")}</tbody>`;
      return `<table>${headHtml}${bodyHtml}</table>`;
    }

    function splitTableRow(row) {
      const trimmed = row.trim().replace(/^\|/, "").replace(/\|$/, "");
      const cells = [];
      let current = "";
      let escaped = false;

      for (const char of trimmed) {
        if (char === "\\" && !escaped) {
          escaped = true;
          current += char;
          continue;
        }
        if (char === "|" && !escaped) {
          cells.push(current.replace(/\\\|/g, "|"));
          current = "";
          continue;
        }
        escaped = false;
        current += char;
      }

      cells.push(current.replace(/\\\|/g, "|"));
      return cells;
    }

    function inlineMarkdown(text) {
      const codeSpans = [];
      let output = escapeHtml(text).replace(/`([^`]+)`/g, (_, code) => {
        const key = `\u0000CODE${codeSpans.length}\u0000`;
        codeSpans.push(`<code>${code}</code>`);
        return key;
      });

      output = output
        .replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (_, alt, url) => {
          const safeUrl = safeHref(url);
          return safeUrl ? `<img src="${safeUrl}" alt="${alt}">` : "";
        })
        .replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (_, label, url) => {
          const safeUrl = safeHref(url);
          return safeUrl ? `<a href="${safeUrl}" target="_blank" rel="noreferrer noopener">${label}</a>` : label;
        })
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/__([^_]+)__/g, "<strong>$1</strong>")
        .replace(/\*([^*\s][^*]*?)\*/g, "<em>$1</em>")
        .replace(/_([^_\s][^_]*?)_/g, "<em>$1</em>")
        .replace(/~~([^~]+)~~/g, "<del>$1</del>");

      codeSpans.forEach((html, index) => {
        output = output.replace(`\u0000CODE${index}\u0000`, html);
      });

      return output;
    }

    function safeHref(raw) {
      const url = String(raw || "").trim();
      if (!url) return "";
      if (/^(https?:|mailto:|\.{0,2}\/|#)/i.test(url)) return escapeAttribute(url);
      if (/^data:image\/(?:png|jpe?g|gif|webp);base64,/i.test(url)) return escapeAttribute(url);
      if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) return escapeAttribute(url);
      return "";
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }
  </script>
</body>
</html>
