<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Salim Sehng">
  <meta name="copyright" content="Copyright (c) 2026 Salim Sehng. All rights reserved.">
  <title>md-pew</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --surface: #fffdf8;
      --panel: #fdfaf2;
      --ink: #1f2420;
      --muted: #70746f;
      --line: #d9d4c8;
      --accent: #1d6d73;
      --accent-strong: #124f54;
      --accent-soft: #dceff0;
      --danger: #a33b32;
      --code-bg: #202721;
      --code-ink: #eef4e8;
      --shadow: 0 18px 46px rgba(31, 36, 32, 0.12);
      --radius: 8px;
      color-scheme: light;
      font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background:
        linear-gradient(135deg, rgba(29, 109, 115, 0.1), transparent 34%),
        radial-gradient(circle at 86% 18%, rgba(172, 80, 56, 0.14), transparent 24%),
        var(--bg);
      color: var(--ink);
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      min-height: 36px;
      padding: 0 13px;
      border-radius: 7px;
      cursor: pointer;
      transition: border-color 0.16s ease, background 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    button:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
      transform: none;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      height: 100%;
      padding: 14px;
      gap: 12px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      background: rgba(255, 253, 248, 0.86);
      border: 1px solid rgba(217, 212, 200, 0.86);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 8px 10px 8px 14px;
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 720;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .file-name {
      color: var(--muted);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .dirty-dot {
      display: inline-flex;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 0 3px rgba(163, 59, 50, 0.12);
      opacity: 0;
    }

    .dirty-dot.visible {
      opacity: 1;
    }

    .actions,
    .view-switch {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .view-switch {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(246, 244, 239, 0.76);
      padding: 3px;
    }

    .view-switch button {
      min-height: 30px;
      border: 0;
      background: transparent;
      padding: 0 10px;
      color: var(--muted);
    }

    .view-switch button.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 6px rgba(31, 36, 32, 0.1);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      min-height: 0;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      background: rgba(255, 253, 248, 0.92);
      border: 1px solid rgba(217, 212, 200, 0.95);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .editor {
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding: 28px;
      background:
        linear-gradient(90deg, rgba(29, 109, 115, 0.08) 1px, transparent 1px) 0 0 / 28px 28px,
        var(--surface);
      color: var(--ink);
      font: 15px/1.7 "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      tab-size: 2;
    }

    .preview {
      height: 100%;
      overflow: auto;
      padding: 30px clamp(24px, 5vw, 58px);
      background: var(--panel);
      line-height: 1.75;
    }

    .preview > *:first-child {
      margin-top: 0;
    }

    .preview h1,
    .preview h2,
    .preview h3,
    .preview h4,
    .preview h5,
    .preview h6 {
      line-height: 1.22;
      margin: 1.55em 0 0.55em;
      font-weight: 760;
      letter-spacing: 0;
    }

    .preview h1 {
      font-size: clamp(30px, 5vw, 52px);
      border-bottom: 2px solid var(--accent);
      padding-bottom: 0.22em;
    }

    .preview h2 {
      font-size: clamp(24px, 3.2vw, 34px);
    }

    .preview h3 {
      font-size: 21px;
    }

    .preview p,
    .preview ul,
    .preview ol,
    .preview blockquote,
    .preview table,
    .preview pre {
      margin: 0 0 1.05em;
    }

    .preview a {
      color: var(--accent-strong);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .preview blockquote {
      border-left: 4px solid var(--accent);
      padding: 0.15em 0 0.15em 1em;
      color: #4e554f;
      background: rgba(220, 239, 240, 0.58);
    }

    .preview code {
      background: rgba(29, 109, 115, 0.12);
      border: 1px solid rgba(29, 109, 115, 0.2);
      border-radius: 5px;
      padding: 0.08em 0.32em;
      font: 0.92em/1.5 "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    .preview pre {
      overflow: auto;
      padding: 16px 18px;
      background: var(--code-bg);
      color: var(--code-ink);
      border-radius: var(--radius);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
    }

    .preview pre code {
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
    }

    .preview table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    .preview th,
    .preview td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    .preview th {
      background: rgba(29, 109, 115, 0.12);
    }

    .preview img {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
      cursor: zoom-in;
    }

    .preview .mermaid-diagram {
      width: fit-content;
      max-width: min(100%, 920px);
      max-height: min(70vh, 560px);
      margin: 0 auto 1.15em;
      overflow: auto;
      padding: 14px;
      position: relative;
      background: rgba(255, 253, 248, 0.78);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .preview .mermaid-diagram.expanded {
      max-width: none;
      max-height: none;
    }

    .preview .mermaid-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      margin: 0 0 10px auto;
      padding: 0 10px;
      position: sticky;
      top: 0;
      z-index: 2;
      border-color: rgba(95, 94, 90, 0.42);
      background: rgba(255, 253, 248, 0.94);
      color: var(--accent-strong);
      font: 12px/1.2 "Cascadia Code", "SFMono-Regular", Consolas, sans-serif;
      box-shadow: 0 4px 14px rgba(31, 36, 32, 0.12);
    }

    .preview .mermaid-diagram.has-overflow .mermaid-toggle,
    .preview .mermaid-diagram.expanded .mermaid-toggle {
      display: flex;
    }

    .preview .mermaid-diagram svg {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, sans-serif;
    }

    .preview hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 2em 0;
    }

    .statusbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      min-height: 30px;
      color: var(--muted);
      font-size: 13px;
      padding: 0 4px;
    }

    .drop-mask {
      position: fixed;
      inset: 14px;
      display: none;
      place-items: center;
      z-index: 10;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      background: rgba(246, 244, 239, 0.78);
      backdrop-filter: blur(10px);
      color: var(--accent-strong);
      font-size: clamp(24px, 5vw, 46px);
      font-weight: 760;
      pointer-events: none;
    }

    .drop-mask.visible {
      display: grid;
    }

    .image-viewer {
      position: fixed;
      inset: 0;
      display: none;
      grid-template-rows: auto 1fr auto;
      z-index: 20;
      background: rgba(31, 36, 32, 0.88);
      color: #fffdf8;
    }

    .image-viewer.visible {
      display: grid;
    }

    .image-viewer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      min-width: 0;
      padding: 12px 14px;
      background: rgba(18, 79, 84, 0.72);
      backdrop-filter: blur(14px);
    }

    .image-viewer-caption {
      flex: 1 1 220px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .image-viewer-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 7px;
      flex-shrink: 0;
    }

    .image-viewer-controls button {
      min-height: 32px;
      border-color: rgba(255, 253, 248, 0.34);
      background: rgba(255, 253, 248, 0.12);
      color: #fffdf8;
    }

    .image-viewer-controls button:hover {
      border-color: rgba(255, 253, 248, 0.8);
      background: rgba(255, 253, 248, 0.2);
    }

    .image-viewer-zoom {
      min-width: 52px;
      text-align: center;
      font: 13px/1.2 "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    .image-viewer-stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    .image-viewer-stage.dragging {
      cursor: grabbing;
    }

    .image-viewer-stage img {
      position: absolute;
      top: 50%;
      left: 50%;
      max-width: none;
      max-height: none;
      border-radius: 6px;
      box-shadow: 0 24px 72px rgba(0, 0, 0, 0.42);
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .image-viewer-hint {
      padding: 10px 14px;
      color: rgba(255, 253, 248, 0.7);
      font-size: 12px;
      text-align: center;
      background: rgba(31, 36, 32, 0.44);
    }

    .export-stage {
      position: fixed;
      top: 0;
      left: -100000px;
      width: 1200px;
      visibility: hidden;
      pointer-events: none;
    }

    .export-page {
      width: 1200px;
      min-height: 1600px;
      padding: 72px;
      background: var(--panel);
      color: var(--ink);
      font: 22px/1.75 Georgia, "Times New Roman", serif;
    }

    .export-page > *:first-child {
      margin-top: 0;
    }

    .export-page h1,
    .export-page h2,
    .export-page h3,
    .export-page h4,
    .export-page h5,
    .export-page h6 {
      line-height: 1.22;
      margin: 1.45em 0 0.52em;
      font-weight: 760;
      letter-spacing: 0;
    }

    .export-page h1 {
      font-size: 48px;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 0.22em;
    }

    .export-page h2 {
      font-size: 34px;
    }

    .export-page h3 {
      font-size: 26px;
    }

    .export-page p,
    .export-page ul,
    .export-page ol,
    .export-page blockquote,
    .export-page table,
    .export-page pre,
    .export-page .mermaid-diagram {
      margin: 0 0 1.05em;
    }

    .export-page code {
      background: rgba(29, 109, 115, 0.12);
      border: 1px solid rgba(29, 109, 115, 0.2);
      border-radius: 5px;
      padding: 0.08em 0.32em;
      font: 0.92em/1.5 "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    .export-page pre {
      overflow: visible;
      padding: 16px 18px;
      background: var(--code-bg);
      color: var(--code-ink);
      border-radius: var(--radius);
    }

    .export-page pre code {
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
    }

    .export-page blockquote {
      border-left: 4px solid var(--accent);
      padding: 0.15em 0 0.15em 1em;
      color: #4e554f;
      background: rgba(220, 239, 240, 0.58);
    }

    .export-page table {
      min-width: 100%;
      width: max-content;
      border-collapse: collapse;
    }

    .export-page th,
    .export-page td {
      border: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }

    .export-page th {
      background: rgba(29, 109, 115, 0.12);
    }

    .export-page img {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
    }

    .export-measure {
      min-height: 0;
    }

    .export-measure img {
      max-width: none;
    }

    .export-page .mermaid-diagram {
      width: fit-content;
      max-width: 100%;
      max-height: none;
      overflow: visible;
      padding: 14px;
      background: rgba(255, 253, 248, 0.78);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .export-page .mermaid-toggle {
      display: none;
    }

    .export-page .mermaid-diagram svg {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, sans-serif;
    }

    .export-measure .mermaid-diagram,
    .export-measure .mermaid-diagram svg {
      max-width: none;
    }

    .export-standalone {
      min-height: 0;
    }

    .export-item-title {
      margin: 0 0 22px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--accent);
      color: var(--accent-strong);
      font: 760 32px/1.25 ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    }

    .export-image-placeholder {
      display: grid;
      gap: 8px;
      min-height: 180px;
      align-content: center;
      padding: 24px;
      border: 2px dashed rgba(29, 109, 115, 0.42);
      border-radius: var(--radius);
      background: rgba(220, 239, 240, 0.48);
      color: var(--accent-strong);
    }

    .export-image-placeholder strong {
      font-size: 20px;
      line-height: 1.35;
    }

    .export-image-placeholder span {
      overflow-wrap: anywhere;
      color: #4e554f;
      font: 14px/1.45 "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    .export-tray {
      display: grid;
      gap: 10px;
      padding: 12px 14px;
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid rgba(217, 212, 200, 0.95);
      border-radius: var(--radius);
      box-shadow: 0 10px 28px rgba(31, 36, 32, 0.1);
    }

    .export-tray[hidden] {
      display: none;
    }

    .export-tray-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--accent-strong);
      font-size: 14px;
      font-weight: 720;
    }

    .export-tray-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .export-tray-list a {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      max-width: 100%;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      color: var(--accent-strong);
      font-size: 13px;
      text-decoration: none;
    }

    .export-tray-list a:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .workspace[data-view="edit"] {
      grid-template-columns: minmax(0, 1fr);
    }

    .workspace[data-view="edit"] .preview-pane {
      display: none;
    }

    .workspace[data-view="preview"] {
      grid-template-columns: minmax(0, 1fr);
    }

    .workspace[data-view="preview"] .editor-pane {
      display: none;
    }

    @media (max-width: 860px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100%;
        height: auto;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .brand {
        width: 100%;
      }

      .actions,
      .view-switch {
        flex-wrap: wrap;
      }

      .workspace {
        grid-template-columns: 1fr;
        min-height: 74vh;
      }

      .workspace[data-view="split"] .pane {
        min-height: 54vh;
      }

      .statusbar {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="brand">
        <div class="brand-title">md-pew</div>
        <span id="dirtyDot" class="dirty-dot" aria-hidden="true"></span>
        <div id="fileName" class="file-name">untitled.md</div>
      </div>

      <div class="view-switch" role="tablist" aria-label="View mode">
        <button type="button" data-view-button="edit">编辑</button>
        <button type="button" data-view-button="split" class="active">分栏</button>
        <button type="button" data-view-button="preview">预览</button>
      </div>

      <div class="actions">
        <button id="openButton" type="button">打开</button>
        <button id="saveButton" type="button" class="primary">保存</button>
        <button id="downloadButton" type="button">下载</button>
        <button id="exportButton" type="button">导出 HTML</button>
        <button id="exportImagesButton" type="button">导出图片</button>
      </div>
    </header>

    <main id="workspace" class="workspace" data-view="split">
      <section class="pane editor-pane" aria-label="Markdown editor">
        <textarea id="editor" class="editor" spellcheck="false"></textarea>
      </section>
      <section class="pane preview-pane" aria-label="Markdown preview">
        <article id="preview" class="preview"></article>
      </section>
    </main>

    <section id="exportTray" class="export-tray" aria-live="polite" hidden>
      <div class="export-tray-header">
        <span id="exportTrayTitle">图片已生成</span>
        <button id="exportTrayClose" type="button">清除</button>
      </div>
      <div id="exportTrayList" class="export-tray-list"></div>
    </section>

    <footer class="statusbar">
      <span id="status">就绪</span>
      <span id="stats">0 词 · 0 字符</span>
    </footer>
  </div>

  <div id="dropMask" class="drop-mask">释放打开 Markdown</div>
  <div id="imageViewer" class="image-viewer" role="dialog" aria-modal="true" aria-label="图片预览">
    <div class="image-viewer-bar">
      <div id="imageViewerCaption" class="image-viewer-caption"></div>
      <div class="image-viewer-controls">
        <button id="imageZoomOut" type="button" aria-label="缩小">-</button>
        <span id="imageViewerZoom" class="image-viewer-zoom">100%</span>
        <button id="imageZoomIn" type="button" aria-label="放大">+</button>
        <button id="imageZoomFit" type="button">适应</button>
        <button id="imageZoomActual" type="button">100%</button>
        <button id="imageViewerClose" type="button">关闭</button>
      </div>
    </div>
    <div id="imageViewerStage" class="image-viewer-stage">
      <img id="imageViewerImage" alt="">
    </div>
    <div class="image-viewer-hint">滚轮缩放，拖动查看细节，Esc 关闭</div>
  </div>
  <div id="exportStage" class="export-stage" aria-hidden="true"></div>
  <input id="fileInput" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>

  <script>
    const editor = document.getElementById("editor");
    const preview = document.getElementById("preview");
    const fileName = document.getElementById("fileName");
    const statusEl = document.getElementById("status");
    const statsEl = document.getElementById("stats");
    const dirtyDot = document.getElementById("dirtyDot");
    const dropMask = document.getElementById("dropMask");
    const fileInput = document.getElementById("fileInput");
    const workspace = document.getElementById("workspace");
    const imageViewer = document.getElementById("imageViewer");
    const imageViewerStage = document.getElementById("imageViewerStage");
    const imageViewerImage = document.getElementById("imageViewerImage");
    const imageViewerCaption = document.getElementById("imageViewerCaption");
    const imageViewerZoom = document.getElementById("imageViewerZoom");
    const exportStage = document.getElementById("exportStage");
    const exportImagesButton = document.getElementById("exportImagesButton");
    const exportTray = document.getElementById("exportTray");
    const exportTrayTitle = document.getElementById("exportTrayTitle");
    const exportTrayList = document.getElementById("exportTrayList");

    let activeFileHandle = null;
    let activeFileName = "untitled.md";
    let savedText = "";
    let currentView = "split";
    let dragDepth = 0;
    let renderTimer = 0;
    let imageViewerScale = 1;
    let imageViewerX = 0;
    let imageViewerY = 0;

    async function handleDrop(event) {
      const items = Array.from(event.dataTransfer.items || []);

      for (const item of items) {
        if (item.kind !== "file") continue;

        if (typeof item.getAsFileSystemHandle === "function") {
          try {
            const handle = await item.getAsFileSystemHandle();
            if (handle && handle.kind === "file") {
              const file = await handle.getFile();
              await loadFile(file, handle);
              return;
            }
          } catch (_) {
            // Some browsers expose the API but block it for local files.
          }
        }

        const file = item.getAsFile();
        if (file) {
          await loadFile(file, null);
          return;
        }
      }

      const [file] = Array.from(event.dataTransfer.files || []);
      if (file) await loadFile(file, null);

          await writable.write(text);

          savedText = text;

    async function exportImages() {
